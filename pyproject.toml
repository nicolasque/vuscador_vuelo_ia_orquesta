[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vusca"
version = "0.1.0"
description = "Buscador de vuelos inteligente orquestado por agentes de IA, optimizador PTO y stopovers multidestino"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "holidays",
    "rich",
    "requests",
    "google-genai",
    "pydantic",
    "python-dotenv",
]

[project.scripts]
vusca = "vusca.cli.main:cli_entrypoint"

[tool.pytest.ini_options]
pythonpath = ["."]
